<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Matrix 3.0 - AI & Real-Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #050811; --panel-bg: #0d1424; --text-main: #f8fafc; --text-muted: #64748b; --neon-blue: #00e5ff; --neon-red: #ff003c; --neon-green: #00ff88; --neon-orange: #ffb703; --border-color: rgba(255, 255, 255, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; flex-shrink: 0; background: var(--panel-bg); border-left: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; z-index: 10; }
        .logo { font-size: 24px; font-weight: 800; color: var(--neon-blue); text-align: center; margin-bottom: 40px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }
        .nav-item { padding: 15px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; transition: 0.3s; color: var(--text-muted); font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(0, 229, 255, 0.1); color: var(--neon-blue); border-right: 3px solid var(--neon-blue); }
        .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 25px; overflow-y: auto; position: relative; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sim-badge { background: rgba(255, 183, 3, 0.15); color: var(--neon-orange); padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid var(--neon-orange); margin-right: 15px; }
        .status-badge { background: rgba(255, 255, 255, 0.05); padding: 8px 20px; border-radius: 30px; font-size: 14px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .status-badge.online { background: rgba(0, 255, 136, 0.1); border-color: var(--neon-green); color: var(--neon-green); }
        .status-badge.offline { background: rgba(255, 0, 60, 0.1); border-color: var(--neon-red); color: var(--neon-red); }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: var(--panel-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); border-top: 3px solid var(--neon-blue); }
        .card.danger { border-top-color: var(--neon-red); }
        .card h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
        .card .value { font-size: 28px; font-weight: 800; }
        .table-panel { background: var(--panel-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        th { color: var(--text-muted); }
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .bg-red { background: rgba(255, 0, 60, 0.1); color: var(--neon-red); }
        .bg-green { background: rgba(0, 255, 136, 0.1); color: var(--neon-green); }
        .bg-orange { background: rgba(255, 183, 3, 0.1); color: var(--neon-orange); }
        .drawer { position: fixed; top: 0; left: -100%; width: 450px; max-width: 100vw; height: 100vh; background: #0a0f18; border-right: 1px solid var(--neon-blue); z-index: 9999; padding: 25px; display: flex; flex-direction: column; transition: left 0.3s; overflow-y: auto; }
        .drawer.open { left: 0; }
        .drawer-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .detail-row { margin-bottom: 15px; } .detail-row label { color: var(--text-muted); font-size: 12px; display: block; margin-bottom: 5px; }
        .detail-row div { background: #050811; padding: 10px; border-radius: 5px; color: var(--neon-green); font-family: monospace; border: 1px solid var(--border-color); }
        .ai-section { margin-top: 20px; border-top: 1px dashed var(--border-color); padding-top: 20px; display: flex; flex-direction: column; }
        .btn-ai { padding: 12px; background: rgba(0, 229, 255, 0.1); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .ai-response { background: #050811; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; color: var(--text-main); font-size: 14px; display: none; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; }
        .btn-mitigate { display: none; padding: 15px; margin-top: 15px; background: rgba(255, 183, 3, 0.1); color: var(--neon-orange); border: 1px solid var(--neon-orange); border-radius: 8px; font-weight: bold; cursor: pointer; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-color); z-index: 10000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .login-box { background: var(--panel-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--neon-blue); text-align: center; box-shadow: 0 0 20px rgba(0,229,255,0.2); }
        .login-box h2 { margin-bottom: 20px; color: var(--neon-blue); }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 5px; border: 1px solid var(--border-color); background: #050811; color: white; }
        .login-box button { width: 100%; padding: 12px; background: var(--neon-blue); color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>🔐 دخول SOC Matrix</h2>
            <input type="email" id="login-email" placeholder="البريد الإلكتروني" value="admin@soc.com">
            <input type="password" id="login-password" placeholder="كلمة المرور">
            <button onclick="login()">تسجيل الدخول</button>
            <p id="login-error" style="color: red; margin-top: 10px; font-size: 14px;"></p>
        </div>
    </div>

    <div id="main-app" style="display: none; width: 100%; height: 100%;">
        <div class="sidebar">
            <div class="logo">SOC MATRIX 3.0</div>
            <div class="nav-item active">📊 لوحة التحكم</div>
            <div class="nav-item" onclick="logout()" style="color: var(--neon-red); margin-top: auto;">🚪 تسجيل الخروج</div>
        </div>
        <div class="main-content">
            <div class="drawer" id="drawer">
                <div class="drawer-header"><h2 style="color:var(--neon-blue)">تفاصيل الحادث</h2><button class="close-btn" onclick="closeDrawer()">×</button></div>
                <div class="detail-row"><label>Source IP</label><div id="d-ip">-</div></div>
                <div class="detail-row"><label>Threat Type</label><div id="d-type">-</div></div>
                <div class="detail-row"><label>Trust Score</label><div id="d-trust" style="color:var(--neon-red)">-</div></div>
                <div class="ai-section">
                    <button class="btn-ai" id="btn-ai" onclick="analyzeWithAI()">🤖 تحليل بالذكاء الاصطناعي</button>
                    <div class="ai-response" id="ai-response"></div>
                    <button class="btn-mitigate" id="btn-mitigate" onclick="mitigateThreat()">⚠️ تنفيذ التوصيات (حظر)</button>
                </div>
            </div>
            <div class="topbar">
                <div class="page-title"><h1 style="font-size: 22px; display: flex; align-items: center;">مركز العمليات الأمنية<span class="sim-badge" id="user-role-badge"></span></h1></div>
                <div class="status-badge" id="socket-status"><div id="socket-dot" style="width:10px; height:10px; background:var(--neon-orange); border-radius:50%;"></div><span id="socket-text">جاري الاتصال...</span></div>
            </div>
            <div class="grid-container">
                <div class="card"><h3>إجمالي التهديدات المحظورة</h3><div class="value" id="total-blocked" style="color:var(--neon-orange)">0</div></div>
                <div class="card danger"><h3>الحوادث النشطة</h3><div class="value" id="critical-active" style="color:var(--neon-red)">0</div></div>
            </div>
            <div class="table-panel">
                <h2 style="font-size: 16px; margin-bottom: 15px;">سجل الحوادث المباشر</h2>
                <table>
                    <thead><tr><th>الأولوية</th><th>ID</th><th>نوع التهديد</th><th>المصدر</th><th>المصداقية</th><th>الحالة</th><th>الوقت</th></tr></thead>
                    <tbody id="table-body"><tr><td colspan="7" style="text-align:center;">بانتظار البث...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const serverURL = `https://soc-matrix.onrender.com`;
        let currentAlert = null;
        let socket;
        let userRole = null;

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                const res = await fetch(`${serverURL}/api/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('soc_token', data.token);
                    localStorage.setItem('soc_role', data.role);
                    initApp(data.token, data.role);
                } else {
                    document.getElementById('login-error').innerText = data.error;
                }
            } catch (e) { document.getElementById('login-error').innerText = "فشل الاتصال بالسيرفر"; }
        }

        function logout() {
            localStorage.removeItem('soc_token');
            localStorage.removeItem('soc_role');
            location.reload();
        }

        function initApp(token, role) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            userRole = role;
            document.getElementById('user-role-badge').innerText = role === 'admin' ? '👑 مدير' : '👁️ مشاهد';

            const script = document.createElement('script');
            script.src = `${serverURL}/socket.io/socket.io.js`;
            script.onload = () => {
                socket = io(serverURL, { auth: { token: token }, transports: ['websocket'] });
                socket.on('connect', () => {
                    document.getElementById('socket-status').className = 'status-badge online';
                    document.getElementById('socket-dot').style.background = 'var(--neon-green)';
                    document.getElementById('socket-text').innerText = 'متصل';
                });
                socket.on('new_alert', (alert) => {
                    const tableBody = document.getElementById('table-body');
                    if (tableBody.innerText.includes('بانتظار')) tableBody.innerHTML = ''; 
                    const tr = document.createElement('tr');
                    let pColor = alert.severity === 'Critical' ? 'bg-red' : 'bg-orange';
                    tr.innerHTML = `<td><span class="badge ${pColor}">${alert.severity}</span></td><td>#${alert.id}</td><td>${alert.threatType}</td><td>${alert.sourceIp}</td><td>${alert.trustScore}%</td><td><span class="badge bg-green status-text">${alert.status}</span></td><td>${alert.time}</td>`;
                    tr.onclick = () => openDrawer(alert);
                    tableBody.insertBefore(tr, tableBody.firstChild);
                    updateStats(token);
                });
                socket.on('ip_mitigated', (ip) => {
                    document.querySelectorAll('#table-body tr').forEach(row => {
                        if (row.innerText.includes(ip)) row.querySelector('.status-text').innerText = 'Permanently-Blocked';
                    });
                });
            };
            document.head.appendChild(script);
            updateStats(token);
        }

        async function updateStats(token) {
            try {
                const res = await fetch(`${serverURL}/api/stats`, { headers: { 'Authorization': `Bearer ${token}` } });
                const stats = await res.json();
                document.getElementById('total-blocked').innerText = stats.total_blocked;
                document.getElementById('critical-active').innerText = stats.critical_active;
            } catch (e) {}
        }

        function openDrawer(alert) {
            currentAlert = alert;
            document.getElementById('d-ip').innerText = alert.sourceIp;
            document.getElementById('d-type').innerText = alert.threatType;
            document.getElementById('d-trust').innerText = alert.trustScore + '%';
            document.getElementById('ai-response').style.display = 'none';
            const btnMitigate = document.getElementById('btn-mitigate');
            btnMitigate.style.display = userRole === 'admin' ? 'block' : 'none';
            document.getElementById('drawer').classList.add('open');
        }
        function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

        async function analyzeWithAI() {
            if (!currentAlert) return;
            const token = localStorage.getItem('soc_token');
            const btn = document.getElementById('btn-ai');
            const responseBox = document.getElementById('ai-response');
            btn.disabled = true; responseBox.style.display = 'none';

            try {
                const res = await fetch(`${serverURL}/api/analyze`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(currentAlert)
                });
                const data = await res.json();
                responseBox.innerText = data.analysis || data.error;
                responseBox.style.display = 'block';
            } catch (e) { responseBox.innerText = "❌ فشل الاتصال"; responseBox.style.display = 'block'; }
            finally { btn.disabled = false; }
        }

        async function mitigateThreat() {
            if (!currentAlert) return;
            const token = localStorage.getItem('soc_token');
            try {
                const res = await fetch(`${serverURL}/api/mitigate`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ ip: currentAlert.sourceIp })
                });
                if (res.ok) document.getElementById('btn-mitigate').innerText = '✅ تم الحظر';
            } catch (e) {}
        }

        const savedToken = localStorage.getItem('soc_token');
        const savedRole = localStorage.getItem('soc_role');
        if (savedToken && savedRole) initApp(savedToken, savedRole);
    </script>
</body>
</html>
